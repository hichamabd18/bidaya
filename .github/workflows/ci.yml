name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (golden + unit)
        run: npm test

      - name: Build offline single-file
        run: node scripts/build-offline.mjs

      - name: Production build
        run: npm run build

      - name: Production smoke test
        run: npm run test:smoke
